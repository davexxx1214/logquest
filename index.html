<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LogQuest 放置冒险原型</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">LOCAL IDLE STRATEGY PROTOTYPE</p>
          <h1>LogQuest 冒险日志</h1>
        </div>
        <div class="save-strip">
          <span id="saveStatus">本地存档已就绪</span>
          <button id="resetBtn" class="icon-btn" title="重置本地原型存档" type="button">RST</button>
        </div>
      </header>

      <main class="game-grid">
        <section class="panel map-panel" aria-labelledby="mapTitle">
          <div class="panel-head">
            <h2 id="mapTitle">大地图</h2>
            <span id="regionCount" class="chip"></span>
          </div>
          <div id="mapList" class="map-list"></div>
        </section>

        <section class="panel mission-panel" aria-labelledby="missionTitle">
          <div class="panel-head">
            <h2 id="missionTitle">出击计划</h2>
            <span id="dangerBadge" class="chip danger-chip">威胁评估</span>
          </div>

          <div id="regionScene" class="region-scene" aria-hidden="true">
            <div class="scene-sky"></div>
            <div class="scene-mid"></div>
            <div class="scene-ground"></div>
          </div>

          <div class="mission-layout">
            <div>
              <h3 id="selectedRegionName">地点</h3>
              <p id="selectedRegionText" class="muted"></p>
              <div id="eventList" class="event-list"></div>
            </div>

            <div class="control-bank">
              <label for="dungeonSelect">迷宫</label>
              <select id="dungeonSelect"></select>

              <label for="floorSelect">挑战层数</label>
              <select id="floorSelect"></select>

              <div class="floor-meter">
                <div id="floorMeterFill"></div>
              </div>

              <button id="startBtn" class="primary-btn" type="button">派遣队伍</button>
              <button id="quickBtn" class="secondary-btn" type="button">快速模拟 100 场</button>
            </div>
          </div>

          <div id="activeRun" class="active-run" hidden>
            <div class="active-run-head">
              <p class="eyebrow">EXPEDITION SLOTS</p>
              <strong>正在探索的小队</strong>
            </div>
            <div id="activeRunList" class="active-run-list"></div>
          </div>
        </section>

        <section class="panel explore-panel" aria-labelledby="exploreTitle">
          <div class="panel-head">
            <h2 id="exploreTitle">探索画面</h2>
            <span id="activeRunCount" class="chip">0 / 2</span>
          </div>
          <div id="explorationStage" class="exploration-stage"></div>
        </section>

        <section class="panel roster-panel" aria-labelledby="rosterTitle">
          <div class="panel-head">
            <h2 id="rosterTitle">英雄队伍</h2>
            <span id="teamCount" class="chip">0 / 3</span>
          </div>
          <div id="heroList" class="hero-list"></div>
        </section>

        <section class="panel codex-panel" aria-labelledby="codexTitle">
          <div class="panel-head">
            <h2 id="codexTitle">怪物图鉴</h2>
            <span id="monsterLevelBand" class="chip"></span>
          </div>
          <div id="monsterList" class="monster-list"></div>
        </section>

        <section class="panel log-panel" aria-labelledby="logTitle">
          <div class="panel-head">
            <h2 id="logTitle">战斗日志</h2>
            <span id="resultBadge" class="chip">等待出击</span>
          </div>
          <div id="combatLog" class="combat-log" role="log" aria-live="polite"></div>
        </section>

        <section class="panel loot-panel" aria-labelledby="lootTitle">
          <div class="panel-head">
            <h2 id="lootTitle">装备与结算</h2>
            <span class="chip">自动换装</span>
          </div>
          <div id="lootList" class="loot-list"></div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
